name: Build & Release SiPresGu APK

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Nomor Versi (misal: v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_notes:
        description: 'Catatan Rilis'
        required: false
        default: 'Rilis otomatis aplikasi SiPresGu Android APK'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Auto-Configure Gradle Files
        run: |
          cd android
          cat << 'EOF' > settings.gradle
          rootProject.name = "SiPresGu"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifacts
        id: prepare_apk
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION="v1.0.0"
          fi
          
          OUTPUT_DIR="android/app/build/outputs/apk/debug"
          TARGET_APK="SiPresGu-${VERSION}.apk"
          
          if [ -f "$OUTPUT_DIR/app-debug.apk" ]; then
            cp "$OUTPUT_DIR/app-debug.apk" "./$TARGET_APK"
            echo "APK_PATH=$TARGET_APK" >> $GITHUB_ENV
            echo "TAG_NAME=$VERSION" >> $GITHUB_ENV
            echo "File APK berhasil disiapkan: $TARGET_APK"
          else
            echo "Error: File APK tidak ditemukan!"
            exit 1
          fi

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiPresGu-APK
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          body: |
            ## 📱 SiPresGu - Sistem Presensi Guru (Android APK)
            
            **Versi:** `${{ env.TAG_NAME }}`
            **Server URL:** `https://sipresgu.web.id/`
            
            ### ✨ Fitur Utama:
            - 📍 **GPS Geolocation Presisi**: Validasi radius presensi guru.
            - 📸 **Presensi Selfie & Kamera**: Terintegrasi izin kamera untuk selfie presensi & upload bukti izin/sakit.
            - 🔄 **Tarik ke Bawah (Pull to Refresh)**: Refresh absensi mudah.
            - ⚙️ **Pengaturan URL Server**: Terhubung langsung ke `https://sipresgu.web.id/`.
            - ⬇️ **Export Unduhan**: Mendukung unduhan laporan PDF & CSV.
            
            ### 📥 Cara Pasang (Install) di Android:
            1. Download file **`${{ env.APK_PATH }}`** di bagian Assets di bawah.
            2. Buka file APK yang telah diunduh di HP Android Anda.
            3. Jika muncul *"Install unknown apps"*, pilih **Izinkan (Allow)**.
            4. Buka aplikasi SiPresGu, lalu izinkan akses **Lokasi (GPS)** dan **Kamera**.
          files: |
            ${{ env.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
